# Render Blueprint specification for Lucky Bet
# Documentation: https://render.com/docs/blueprint-spec

services:
  # Option 1: Web Service (Node.js + Express serving the built app)
  - type: web
    name: lucky-bet-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /health
    autoDeploy: true
